<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסך תצוגה - החלפה אוטומטית</title>
<style>
html, body { margin: 0; padding: 0; background: #111; height: 100%; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: #1d1d1d; border-bottom: 1px solid #333; font-family: sans-serif; color: #eee; }
.bar button { font-size: 18px; padding: 10px 22px; border-radius: 8px; border: 2px solid #555; background: #2a2a2a; color: #eee; cursor: pointer; }
.bar button.active { background: #2f6f4f; border-color: #6fcf97; color: #fff; }
.status { font-family: sans-serif; font-size: 15px; line-height: 1.5; padding: 6px 12px; background: #161616; color: #bbb; }
.status b { color: #fff; }
#frame-holder { position: absolute; top: 112px; left: 0; right: 0; bottom: 28px; background: #000; }
#frame-holder iframe { width: 100%; height: 100%; border: 0; }
.note { position: fixed; bottom: 0; left: 0; right: 0; font-family: sans-serif; font-size: 13px; color: #888; padding: 4px 12px; background: #161616; }
</style>
</head>
<body>
<div class="bar">
  <button id="btn-videos" onclick="setMode('videos')">סרטונים</button>
  <button id="btn-board" onclick="setMode('board')">לוח</button>
  <button id="btn-auto" onclick="setMode('auto')">אוטומטי</button>
  <span id="now-showing"></span>
</div>
<div class="status" id="status">טוען זמנים...</div>
<div id="frame-holder"></div>
<div class="note">דף בדיקה: לוחצים "לוח", בודקים שהלוח מופיע, ואז "סרטונים" ובודקים שהשידור חוזר להתנגן עם קול בלי לחיצה נוספת.</div>
<script>
var JEM_URL = 'https://videos.jem.tv/lobby-broadcast?playlist=lobby-broadcast-il';
var BOARD_URL = 'https://script.google.com/macros/s/AKfycbyflNueZ5YAizRpb0Wvxd8sSBoyjQKfkGdl-l62bX1lzOpjxMj044cdsGol5jXwnvWU/exec';
var GEONAME_ID = '294071'; // Netanya
var BEFORE_MIN = 60;
var AFTER_MIN = 30;
var mode = 'auto';
var win = null;

function fmt(d) {
  return d.toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem', weekday: 'short', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function iso(d) { return d.toISOString().slice(0, 10); }

function loadWindow() {
  var today = new Date();
  var start = new Date(today.getTime() - 6 * 864e5);
  var end = new Date(today.getTime() + 13 * 864e5);
  return fetch('https://www.hebcal.com/hebcal?v=1&cfg=json&maj=off&min=off&mod=off&nx=off&ss=off&mf=off&s=off&c=on&b=18&geo=geoname&geonameid=' + GEONAME_ID + '&start=' + iso(start) + '&end=' + iso(end))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var now = new Date();
      var fridays = (data.items || [])
        .filter(function (i) { return i.category === 'candles'; })
        .map(function (i) { return new Date(i.date); })
        .filter(function (d) { return d.getDay() === 5; })
        .sort(function (a, b) { return a - b; });
      var chain = Promise.resolve(null);
      fridays.forEach(function (candle) {
        chain = chain.then(function (found) {
          if (found) return found;
          var shabbat = new Date(candle.getTime() + 864e5);
          return fetch('https://www.hebcal.com/zmanim?cfg=json&geonameid=' + GEONAME_ID + '&date=' + iso(shabbat))
            .then(function (r) { return r.json(); })
            .then(function (z) {
              var tzeit = new Date(z.times.tzeit85deg);
              var w = {
                candle: candle,
                toBoard: new Date(candle.getTime() - BEFORE_MIN * 60000),
                tzeit: tzeit,
                toVideos: new Date(tzeit.getTime() + AFTER_MIN * 60000)
              };
              return now < w.toVideos ? w : null;
            });
        });
      });
      return chain;
    });
}

function currentShown() {
  if (mode !== 'auto') return mode;
  if (win) {
    var now = new Date();
    if (now >= win.toBoard && now < win.toVideos) return 'board';
  }
  return 'videos';
}

function render() {
  var shown = currentShown();
  document.getElementById('btn-videos').className = mode === 'videos' ? 'active' : '';
  document.getElementById('btn-board').className = mode === 'board' ? 'active' : '';
  document.getElementById('btn-auto').className = mode === 'auto' ? 'active' : '';
  document.getElementById('now-showing').innerHTML = 'מוצג כעת: <b>' + (shown === 'board' ? 'לוח מסך התצוגה' : 'שידור JEM') + '</b>';
  var holder = document.getElementById('frame-holder');
  var want = shown === 'board' ? 'board' : 'jem';
  if (holder.getAttribute('data-current') !== want) {
    holder.setAttribute('data-current', want);
    holder.innerHTML = '';
    var f = document.createElement('iframe');
    f.src = shown === 'board' ? BOARD_URL : JEM_URL;
    if (shown !== 'board') f.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
    f.setAttribute('allowfullscreen', '');
    holder.appendChild(f);
  }
}

function setMode(m) { mode = m; render(); }

function refreshTimes() {
  loadWindow().then(function (w) {
    win = w;
    var el = document.getElementById('status');
    if (!w) { el.textContent = 'לא נמצאו זמנים לשבת הקרובה'; }
    else {
      el.innerHTML = 'שבת בנתניה: הדלקת נרות <b>' + fmt(w.candle) + '</b> · צאת שבת <b>' + fmt(w.tzeit) + '</b><br>' +
        'מעבר ללוח: <b>' + fmt(w.toBoard) + '</b> · חזרה לסרטונים: <b>' + fmt(w.toVideos) + '</b>' +
        ' (מקור: Hebcal, הדלקה 18 דק׳ לפני השקיעה, צאת 8.5°)';
    }
    render();
  }).catch(function () {
    document.getElementById('status').textContent = 'שגיאה בטעינת הזמנים מ-Hebcal';
    render();
  });
}

refreshTimes();
setInterval(refreshTimes, 6 * 3600 * 1000);
setInterval(render, 30000);
</script>
</body>
</html>
